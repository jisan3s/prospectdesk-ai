name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
      RUN_RLS_TESTS: "0"
      FINAL_REVIEW_MODE: production
      FINAL_REVIEW_SMOKE: "1"
      FINAL_REVIEW_ARTIFACT_DIR: artifacts/launch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Isolated PostgreSQL security checks
        run: |
          npm install --prefix "$RUNNER_TEMP/security-db" --no-save --package-lock=false @electric-sql/pglite@0.6.0
          node scripts/verify-security-database.mjs "$RUNNER_TEMP/security-db/node_modules/@electric-sql/pglite/dist/index.js"
      - run: npx playwright install --with-deps chromium
      - name: Production build and isolated browser regression
        run: node scripts/run-final-review.mjs
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-verification
          path: artifacts/launch/
          retention-days: 7
          if-no-files-found: ignore
